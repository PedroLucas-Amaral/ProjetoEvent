<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

   <title>Login - EventSpace Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <section class="login-container">

            <h1>EventSpace Manager</h1>

            <p class="subtitulo">
                Entre na sua conta
            </p>

            <form id="loginForm">

                <div class="campo">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu email"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <a href="paginas/pgprincipal.html">
                    <button type="submit">
                        Entrar
                    </button>
                </a>

            </form>


            <p class="cadastro">

                Não possui uma conta?

                <a href="cadastro.html">

                    Cadastre-se

                </a>
                <br><br>
                <a href="dashboard.html">

                    dashboard

                </a>

            </p>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
