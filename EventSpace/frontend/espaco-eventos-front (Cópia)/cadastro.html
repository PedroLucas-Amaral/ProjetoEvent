<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro - EventSpace Manager</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="areaprincipal">

<div class="container">

    <div class="login-container">

        <h1>EventSpace Manager</h1>

        <h2 class="subtitulo">Criar Conta</h2>

        <form id="formCadastro">

            <div class="campo">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >

            </div>


            <div class="campo">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu email"
                    required
                >

            </div>


            <div class="campo">

                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="text"
                    id="telefone"
                    placeholder="Digite seu telefone"
                    required
                >

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>


            <button type="submit" class="logincadastro">

                Criar Conta

            </button>

        </form>


        <p class="cadastro">

            Já possui uma conta?

            <a href="index.html">

                Fazer login

            </a>

        </p>

    </div>

</div>


<script src="js/cadastro.js"></script>

</body>

</html>
